name: CI Auto Fix

# When the CI workflow fails on a PR, Claude reads the failed job logs, fixes the cause on
# the PR branch and pushes one `[agent-fix]` commit. Three consecutive `[agent-fix]`
# commits stop it. The `workflows:` name below must match the CI workflow's `name:`.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: ci-auto-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  fix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Decide whether to fix
        id: gate
        run: |
          set -eu
          consecutive=0
          for subject in $(git log -n 3 --pretty=%s | sed 's/ .*//'); do
            [ "$subject" = "[agent-fix]" ] || break
            consecutive=$((consecutive + 1))
          done
          echo "consecutive agent-fix commits: $consecutive"
          if [ "$consecutive" -ge 3 ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: Git identity
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
      - uses: anthropics/claude-code-action@v1
        if: steps.gate.outputs.run == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 100
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh run view:*),Bash(gh pr view:*)"
            --system-prompt "Always write in Japanese."
          prompt: |
            CI run ${{ github.event.workflow_run.html_url }} failed on branch `${{ github.event.workflow_run.head_branch }}` of ${{ github.repository }}.

            Read the failed job logs with `gh run view ${{ github.event.workflow_run.id }} --log-failed`. Fix the root cause with the smallest change that holds, leaving a test's assertions and unrelated code as they are. Leave lockfiles and generated files to their generators. When the failure comes from outside this branch's changes or from the runner, change nothing and stop.

            Commit everything in one commit whose message starts with `[agent-fix] `, then `git push`.
