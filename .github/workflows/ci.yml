name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: omni-stove/.github/.github/workflows/ci.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      node-version: "26"
      lint-command: 'pnpm dlx @biomejs/biome@2 check . && pnpm --silent knip'
      typecheck-command: 'pnpm typecheck'
      test-command: 'pnpm test && pnpm dlx bats@1 tests'
      run-test: true
      # Review and the agent-fix loop live in pr-review.yml; a second review here would
      # post duplicate findings and race it on fix pushes.
      run-review: false
    secrets: inherit
