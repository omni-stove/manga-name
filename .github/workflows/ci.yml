name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: omni-stove/.github/.github/workflows/ci.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    with:
      node-version: "26"
      # The standalone Biome binary, not the npm package or mise, so lint needs nothing
      # beyond the checkout.
      lint-command: 'curl -fsSL -o "$RUNNER_TEMP/biome" https://github.com/biomejs/biome/releases/download/@biomejs/biome@2.5.15/biome-linux-x64 && chmod +x "$RUNNER_TEMP/biome" && "$RUNNER_TEMP/biome" ci .'
      typecheck-command: 'pnpm typecheck'
      run-test: false
      run-review: true
      review-provider: "claude"
    secrets: inherit
