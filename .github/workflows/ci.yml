name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: omni-stove/.github/.github/workflows/ci.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    with:
      node-version: "26"
      # Biome is the standalone binary from its GitHub release, not the mise tool.
      lint-command: 'curl -fsSL -o "$RUNNER_TEMP/biome" https://github.com/biomejs/biome/releases/download/@biomejs/biome@2.5.15/biome-linux-x64 && chmod +x "$RUNNER_TEMP/biome" && "$RUNNER_TEMP/biome" ci . && pnpm --silent knip'
      typecheck-command: 'pnpm typecheck'
      test-command: 'pnpm test && pnpm dlx bats@1 tests'
      run-test: true
      run-review: true
      review-provider: "claude"
      run-fix: true
      fix-provider: "claude"
      regen-command: 'pnpm install --lockfile-only --no-frozen-lockfile'
    secrets: inherit
