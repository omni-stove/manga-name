name: Desktop

# 両 OS で tauri build が通ることを、タグを打つ前に手で確かめるためのもの。push や PR ごとに走らせると
# 毎回 2 OS 分のビルドを待たされるので、配布するタグ push の desktop-release.yml 以外では自動で走らせない。
# 署名用の証明書も updater の秘密鍵も使わないので、成果物は上げない。
on:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm & Node.js
        uses: omni-stove/.github/actions/setup-pnpm-node@main
        with:
          node-version: "26"

      - name: Version check
        run: pnpm --filter @manga/desktop version:check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Build
        run: pnpm --filter @manga/desktop build
