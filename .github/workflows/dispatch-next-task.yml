name: Dispatch Next Task

# 親 Issue #3 のチェックリストが変わるか、子 Issue が close されたら、依存がすべて終わった
# 子 Issue に implementation ラベルを付けて Issue Worker を起動する。判定は scripts/next-issues.sh。
#
# ラベルは agent 用 GitHub App のトークンで付ける。github.token で付けたラベルでは labeled
# イベントが他のワークフローを起動せず、Issue Worker が動かないため。

on:
  issues:
    types: [edited, closed]
  workflow_dispatch:

env:
  PARENT_ISSUE: "3"

# 同時に走ると同じ Issue に二重にラベルを付けようとするので直列にする。
concurrency:
  group: dispatch-next-task
  cancel-in-progress: false

jobs:
  dispatch:
    # job の if では env を参照できないため、親 Issue 番号をここにも書く。
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'closed' || github.event.issue.number == 3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      HAS_AGENT_APP: ${{ secrets.AGENT_GH_APP_ID != '' && secrets.AGENT_GH_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Generate agent App token
        id: app
        if: env.HAS_AGENT_APP == 'true'
        uses: omni-stove/.github/actions/github-app-token@main
        with:
          app-id: ${{ secrets.AGENT_GH_APP_ID }}
          private-key: ${{ secrets.AGENT_GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/next-issues.sh
          sparse-checkout-cone-mode: false

      - name: Label the issues that can start
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$HAS_AGENT_APP" != "true" ]; then
            echo "::warning::AGENT_GH_APP_ID / AGENT_GH_APP_PRIVATE_KEY が無いので github.token で付けます。このラベルでは Issue Worker は起動しません"
          fi
          gh issue view "$PARENT_ISSUE" --json body --jq .body > "$RUNNER_TEMP/body.md"
          gh issue list --state all --limit 500 --json number,state,labels > "$RUNNER_TEMP/issues.json"
          ready=$(scripts/next-issues.sh "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/issues.json")
          if [ -z "$ready" ]; then
            echo "::notice::着手できる Issue はありません"
            exit 0
          fi
          for n in $ready; do
            gh issue edit "$n" --add-label implementation
            echo "::notice::#$n に implementation を付けました"
          done
