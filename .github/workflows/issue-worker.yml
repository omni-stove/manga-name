name: Issue Worker

on:
  issues:
    types: [labeled]

jobs:
  work:
    uses: omni-stove/.github/.github/workflows/issue-worker.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    with:
      provider: "claude"
      node-version: "26"
      regen-command: 'pnpm install --lockfile-only --no-frozen-lockfile'
    secrets: inherit
