[install]
description = "Install the repo's dependencies"
run = "pnpm install --frozen-lockfile"

[setup]
description = "Install dependencies and skill-kit, then sync (run by make setup)"
depends = ["install"]
run = [
  "gh api repos/omni-stove/skill-kit/contents/install.sh -q .content | base64 -d | sh",
  "skill-kit code sync",
]

[update]
description = "Pull skill-kit and re-sync this repo"
run = "skill-kit code update"

[lint]
description = "Biome lint and format check, then knip for unused files, exports and dependencies"
run = ["biome check .", "pnpm --silent knip"]

[lint-fix]
description = "Biome lint and format with auto-fix"
run = "biome check --write ."

[format]
description = "Biome format only"
run = "biome format --write ."

[typecheck]
description = "tsc --noEmit across all packages"
run = "pnpm typecheck"

[test]
description = "Vitest across all packages, then bats for the shell-facing scripts in tests/"
run = ["pnpm test", "bats tests"]

[test-watch]
description = "Vitest in watch mode"
run = "pnpm test:watch"

[check]
description = "lint + typecheck + test in parallel; prints output only for the ones that fail"
quiet = true
run = '''
set -u
dir=$(mktemp -d)
trap 'rm -rf "$dir"' EXIT
for t in lint typecheck test; do
  ( code=0; mise run --quiet "$t" >"$dir/$t.log" 2>&1 || code=$?; echo "$code" >"$dir/$t.code" ) &
done
wait
status=0
for t in lint typecheck test; do
  code=$(cat "$dir/$t.code")
  [ "$code" = 0 ] && continue
  status=1
  echo "✗ $t (exit $code)"
  cat "$dir/$t.log"
  echo
done
exit $status
'''

[tasks]
description = "Task state in docs/tasks.json: next | show <id> | start <id> [--decided] | done <id> | render"
usage = '''
arg "<cmd>" help="next | show | start | done | render"
arg "[id]" help="task id, e.g. 12"
flag "--decided" help="start a gated task whose question is decided in docs/06-open-questions.md"
'''
run = 'scripts/tasks.sh "$usage_cmd" ${usage_id:-} ${usage_decided:+--decided}'
