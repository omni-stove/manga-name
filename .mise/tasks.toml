[install]
description = "Install the repo's dependencies"
run = "pnpm install --frozen-lockfile"

[setup]
description = "Install dependencies and skill-kit, then sync (run by make setup)"
depends = ["install"]
run = [
  "gh api repos/omni-stove/skill-kit/contents/install.sh -q .content | base64 -d | sh",
  "skill-kit code sync",
]

[update]
description = "Pull skill-kit and re-sync this repo"
run = "skill-kit code update"

[lint]
description = "Biome lint and format check, knip for unused files, exports and dependencies, actionlint for the workflows, then the desktop version check"
run = ["biome check .", "pnpm --silent knip", "actionlint", "pnpm --silent --filter @manga/desktop version:check"]

[lint-rust]
description = "rustfmt check and clippy for apps/desktop/src-tauri. Kept out of lint because clippy compiles Tauri"
dir = "apps/desktop/src-tauri"
run = ["cargo fmt --check", "cargo clippy --all-targets -- -D warnings"]

[lint-fix]
description = "Biome lint and format with auto-fix"
run = "biome check --write ."

[format]
description = "Biome format only"
run = "biome format --write ."

[i18n]
description = "Compile packages/i18n messages into src/paraglide"
run = "pnpm --filter @manga/i18n compile"

[typecheck]
description = "tsc --noEmit across all packages"
depends = ["i18n"]
run = "pnpm typecheck"

[test]
description = "Vitest across all packages"
depends = ["i18n"]
run = "pnpm test"

[coverage]
description = "Vitest with coverage; HTML reports go to coverage/ and workers/*/coverage/"
run = ["pnpm exec vitest run --coverage", "pnpm --filter \"./workers/*\" test --coverage"]

[perf]
description = "Vitest with the wall-clock budgets (PERF=1). Kept out of test because shared CI runners make timings flaky"
run = "PERF=1 pnpm exec vitest run"

[storybook]
description = "Storybook for packages/ui on http://localhost:6006"
run = "pnpm --filter @manga/ui storybook"

[test-storybook]
description = "Run the play functions of packages/ui stories in headless Chromium. Kept out of test because it starts a real browser"
run = "pnpm --filter @manga/ui test-storybook"

[test-watch]
description = "Vitest in watch mode"
run = "pnpm test:watch"

[check]
description = "lint + typecheck + test in parallel; prints output only for the ones that fail"
quiet = true
# typecheck と test がそれぞれ i18n を作り直すと、同じディレクトリを同時に消し合い、knip も消えかけのファイルを読んで落ちるので、先に一度だけ作って子は --skip-deps で走らせる
depends = ["i18n"]
run = '''
set -u
dir=$(mktemp -d)
trap 'rm -rf "$dir"' EXIT
for t in lint typecheck test; do
  ( code=0; mise run --quiet --skip-deps "$t" >"$dir/$t.log" 2>&1 || code=$?; echo "$code" >"$dir/$t.code" ) &
done
wait
status=0
for t in lint typecheck test; do
  code=$(cat "$dir/$t.code")
  [ "$code" = 0 ] && continue
  status=1
  echo "✗ $t (exit $code)"
  cat "$dir/$t.log"
  echo
done
exit $status
'''

[dev]
description = "Run workers/api and apps/web together for local development (web on :5173, api on :8787)"
depends = ["dev-api", "dev-web"]

[dev-desktop]
description = "Run workers/api and apps/desktop (Tauri) together; Tauri starts apps/web on :5173 itself"
depends = ["dev-api", "dev-tauri"]

[dev-tauri]
description = "apps/desktop (Tauri) only, with its apps/web pointed at the local workers/api"
# tauri.conf.json の beforeDevCommand が apps/web を起動し、この env を引き継ぐ
env = { VITE_API_BASE_URL = "http://localhost:8787" }
run = "pnpm --filter @manga/desktop dev"

[dev-web]
description = "apps/web on :5173, pointed at the local workers/api"
env = { VITE_API_BASE_URL = "http://localhost:8787" }
run = "pnpm --filter @manga/web dev"

[dev-api]
description = "workers/api on :8787 with local D1/R2, ENVIRONMENT=development and no country restriction"
depends = ["db-migrate"]
run = "pnpm --filter @manga/api exec wrangler dev --port 8787 --var ENVIRONMENT:development --var ALLOWED_COUNTRIES:"

[cli]
description = "The manga CLI (apps/cli): login, list projects, and plan a plot into a new episode of a project; run with no arguments for usage"
# 渡したプロットのパスを呼んだ場所から読めるよう、呼んだディレクトリで走らせる
dir = "{{cwd}}"
run = "{{config_root}}/apps/cli/bin/manga.js"

[db-migrate]
description = "Apply workers/api D1 migrations to the local database"
dir = "workers/api"
run = "pnpm exec wrangler d1 migrations apply DB --local"

[spec]
description = "Print the JSDoc of apps/*, packages/* and workers/* as Markdown; takes one or more paths, and exits 2 with usage when given none"
run = "node .agents/skills/spec/scripts/extract.ts"
