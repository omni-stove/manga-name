packages:
  - apps/*
  - packages/*
  - workers/*
  - e2e

# wrangler が連れてくる esbuild・sharp・workerd の install script は走らせない。どれも同梱の
# optional dependency にあるビルド済みバイナリを確かめるだけで、無くても動くため。
allowBuilds:
  esbuild: false
  sharp: false
  workerd: false
  # msw の postinstall はブラウザ用 Service Worker を配置するだけで、node のテストでは使わない。
  msw: false

# 全パッケージで同じバージョンを使う依存。各 package.json では "catalog:" と書く。
catalog:
  typescript: ^7.0.2
  vitest: ^5.0.4
  # vitest と同じバージョンでないと browser mode とカバレッジが起動しない
  '@vitest/coverage-v8': 5.0.4
  '@vitest/coverage-istanbul': 5.0.4
  '@vitest/browser-playwright': ^5.0.4
  # apps/web の hc が workers/api の経路の型を読むので、両方で同じ版でないと型の展開が壊れる
  hono: ^4.9.0

minimumReleaseAgeExclude:
  - '@cloudflare/vitest-plugin@1.4.3'
